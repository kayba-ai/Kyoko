<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyoko</title>
    <script>
      // Apply the stored (or system) theme before React mounts to avoid a flash
      // of the wrong theme. Mirrors src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("kyoko-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-qKkSnHng.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BR8DN_t8.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
