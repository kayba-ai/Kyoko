[metadata]
name = kyoko
version = 0.1.0
description = Local-first repair loop for debugging and improving AI agents.
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
author = Kayba
keywords = agents, evals, telemetry, local-first, optimization
classifiers =
    Development Status :: 2 - Pre-Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Software Development :: Testing
    Topic :: System :: Monitoring
url = https://github.com/kayba-ai/kyoko
project_urls =
    Homepage = https://kayba.ai
    Repository = https://github.com/kayba-ai/kyoko
    Documentation = https://github.com/kayba-ai/kyoko/tree/main/docs
    Issues = https://github.com/kayba-ai/kyoko/issues

[options]
packages = find:
python_requires = >=3.12
install_requires =
    jsonschema>=4.0
include_package_data = True

[options.extras_require]
ace =
    ace-framework>=0.12.0

[options.packages.find]
include =
    kyoko*

[options.package_data]
kyoko =
    assets/**/*.json
    assets/**/*.py
    assets/**/*.md
    assets/web/index.html
    assets/web/**/*

[options.entry_points]
console_scripts =
    kyoko = kyoko.cli:main
